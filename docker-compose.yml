services:
  api:
    build: .
    image: effect-todo-app
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: 3000
      DATABASE_PATH: /app/data/todo.db
    volumes:
      # Named volume, so the database survives `docker compose down` and rebuilds.
      - todo-data:/app/data
    restart: unless-stopped
    stop_grace_period: 10s

  web:
    build: ./web
    image: effect-todo-web
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  todo-data:
